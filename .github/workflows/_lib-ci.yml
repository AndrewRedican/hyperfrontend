name: Library CI Template

on:
  workflow_call:
    inputs:
      project-name:
        description: 'Nx project name (e.g., lib-nexus, plugin-features)'
        required: true
        type: string
      coverage-path:
        description: 'Path to lcov.info file'
        required: true
        type: string
      coverage-flag:
        description: 'Codecov flag name'
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Typecheck
        run: CI=1 npx nx typecheck ${{ inputs.project-name }} --parallel=1

      - name: Build
        run: CI=1 npx nx build ${{ inputs.project-name }} --parallel=1

      - name: Test
        run: CI=1 npx nx test ${{ inputs.project-name }} --coverage --parallel=1

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-path }}
          flags: ${{ inputs.coverage-flag }}
          fail_ci_if_error: false
