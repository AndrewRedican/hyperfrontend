name: graph-advisory

on:
  schedule:
    # Weekly, Monday early morning UTC: the merges of the week are on main and
    # nothing else runs at that hour.
    - cron: '30 5 * * 1'
  workflow_dispatch:
    inputs:
      merges:
        description: 'How many merges on main to replay'
        required: false
        default: '20'
      commits:
        description: 'How many commits on main to replay one by one'
        required: false
        default: '40'

# Read-only: the report is a workflow artifact, nothing is written to the repository.
permissions:
  contents: read

concurrency:
  group: graph-advisory
  cancel-in-progress: false

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: every replayed range is checked out in a worktree

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build and verify the graph state cold
        run: |
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force | tee -a "$GITHUB_STEP_SUMMARY"
          $GRAPH verify

      - name: Replay the newest merges and commits with Nx
        env:
          MERGES: ${{ inputs.merges || '20' }}
          COMMITS: ${{ inputs.commits || '40' }}
        run: |
          # A revision whose nx.json names a plugin the installed node_modules lacks is reported and skipped.
          REPLAY="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/scripts/replay-affected.ts --ref origin/main"
          $REPLAY --count="$MERGES"
          $REPLAY --commits --count="$COMMITS"

      - name: Compare the owned selection with the replayed one
        run: node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/scripts/compare-affected.ts --summary

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graph-advisory-report
          path: |
            .hf/replay/report.md
            .hf/replay/*.json
          retention-days: 30
          if-no-files-found: warn
