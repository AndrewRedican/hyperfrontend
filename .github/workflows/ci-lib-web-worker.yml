# Build status reporter for lib-web-worker
# This workflow does NOT build - it reports the outcome of the library's tasks in the ci workflow's results on main
name: lib-web-worker

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  status:
    uses: ./.github/workflows/_lib-status.yml
    with:
      project-name: lib-web-worker
      library-path: libs/web-worker
