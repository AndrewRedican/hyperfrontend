name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - run: npm ci
      - run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - run: npm ci
      - run: npx nx run-many -t=lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - name: Install Hugo
        run: bash .devcontainer/setup-hugo.sh
      - run: npm ci
      - run: npx nx run-many -t=build

  test:
    name: unit
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      has_coverage: ${{ steps.run-tests.outputs.has_coverage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - run: npm ci
      - name: Run tests
        id: run-tests
        run: |
          npx nx run-many -t=test --coverage --coverageReporters=lcov
          if [ -d "coverage" ]; then
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload coverage artifacts
        if: steps.run-tests.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  coverage-check:
    name: coverage
    needs: [test]
    if: needs.test.outputs.has_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - run: |
          echo "📊 Checking coverage thresholds..."
          echo "TODO: Add threshold check logic, e.g.:"
          echo "  npx nyc check-coverage --lines 80 --functions 80 --branches 80"
          # Uncomment when ready:
          # npx nyc check-coverage --lines 80 --functions 80 --branches 80

  e2e:
    name: e2e
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - run: npm ci
      - run: npx nx run-many -t=e2e

  # This job will be the required status check for branch protection
  ci-status:
    name: CI Status Check
    if: always()
    needs: [format, lint, build, test, coverage-check, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI success
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "CI pipeline failed!"
          exit 1

      - name: CI passed
        run: |
          echo "✅ All CI checks passed!"
          if [ "${{ needs.coverage-check.result }}" == "skipped" ]; then
            echo "ℹ️  Coverage check was skipped (no tests to run)"
          fi
