name: Add Contributor

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  add-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: All Contributors Bot
        uses: all-contributors/all-contributors-bot@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
