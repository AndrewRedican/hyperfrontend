name: pr

on:
  pull_request:
    branches: [main]

# Read-only permissions by default
permissions:
  contents: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      affected-projects: ${{ steps.nx-affected.outputs.affected-projects }}
      has-affected: ${{ steps.nx-affected.outputs.has-affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Required for Nx affected calculations

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Calculate affected projects
        id: nx-affected
        uses: ./.github/actions/nx-affected
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD

  format:
    name: format
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run format check
        uses: ./.github/actions/run-checks
        with:
          check-type: format
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run lint
        uses: ./.github/actions/run-checks
        with:
          check-type: lint
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run typecheck
        uses: ./.github/actions/run-checks
        with:
          check-type: typecheck
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  build:
    name: build
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run build
        uses: ./.github/actions/run-checks
        with:
          check-type: build
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-pr
          path: dist/
          retention-days: 3
          if-no-files-found: warn

  test:
    name: test
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run tests
        uses: ./.github/actions/run-checks
        with:
          check-type: test
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-pr
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run E2E tests
        uses: ./.github/actions/run-checks
        with:
          check-type: e2e
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  ci-status:
    name: status
    runs-on: ubuntu-latest
    needs: [setup, format, lint, typecheck, build, test, e2e]
    if: always()
    steps:
      - name: Check CI status
        run: |
          # If no affected projects, pass
          if [ "${{ needs.setup.outputs.has-affected }}" != "true" ]; then
            echo "✅ No affected projects - PR checks passed"
            exit 0
          fi

          # Check if any required job failed
          if [ "${{ needs.format.result }}" = "failure" ] || \
             [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.typecheck.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "❌ One or more CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"

  version-validation:
    name: version-check
    runs-on: ubuntu-latest
    needs: [ci-status]
    if: needs.ci-status.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PR_PAT }}

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and update versions
        id: version-check
        run: |
          echo "Checking versions for affected libraries..."

          # Get affected library projects
          AFFECTED=$(npx nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --type=lib 2>/dev/null || echo "")

          if [ -z "$AFFECTED" ]; then
            echo "No affected libraries"
            echo "needs_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Affected libraries: $AFFECTED"

          # Run idempotent version check for each library
          UPDATED=""
          for lib in $AFFECTED; do
            echo "Checking $lib..."
            RESULT=$(npx nx version $lib --skipCommit --skipTag 2>&1 || true)
            if echo "$RESULT" | grep -q "version updated"; then
              UPDATED="$UPDATED $lib"
              echo "  ✓ $lib: version updated"
            elif echo "$RESULT" | grep -q "already exists (skipping)"; then
              echo "  ○ $lib: already versioned"
            else
              echo "  ○ $lib: no version change needed"
            fi
          done

          if [ -n "$UPDATED" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "updated_libs=$UPDATED" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit version updates
        if: steps.version-check.outputs.needs_update == 'true'
        run: |
          # Stage version changes
          git add libs/*/package.json libs/*/CHANGELOG.md plugins/*/package.json plugins/*/CHANGELOG.md 2>/dev/null || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi

          # Commit the changes
          git commit -m "chore: update versions for${{ steps.version-check.outputs.updated_libs }}"



          # Push to the PR branch
          git push

          echo "✓ Pushed version updates to PR"

      - name: Comment on PR
        if: steps.version-check.outputs.needs_update == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const COMMENT_MARKER = '<!-- hyperfrontend-version-bot -->'
            const libs = '${{ steps.version-check.outputs.updated_libs }}'.trim().split(' ').filter(Boolean)

            const body = `${COMMENT_MARKER}
            ## 📦 Version Updates

            The following libraries had their versions and CHANGELOGs updated:

            ${libs.map(lib => `- \`${lib}\``).join('\n')}

            These changes have been committed to this PR. Please review the CHANGELOG entries.

            ---
            *This update was performed automatically by the CI version validation.*`

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            const existingComment = comments.find(c => c.body && c.body.includes(COMMENT_MARKER))

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
              console.log('Updated existing version comment')
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
              console.log('Created new version comment')
            }
