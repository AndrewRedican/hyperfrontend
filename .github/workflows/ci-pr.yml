name: pr

on:
  pull_request:
    branches: [main]

# Read-only permissions by default
permissions:
  contents: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      affected-projects: ${{ steps.nx-affected.outputs.affected-projects }}
      has-affected: ${{ steps.nx-affected.outputs.has-affected }}
      graph-digest: ${{ steps.graph-state.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Required for Nx affected calculations

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Restore graph state
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .hf/graph
          key: ${{ runner.os }}-graph-state-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-graph-state-${{ hashFiles('**/package-lock.json') }}-

      - name: Build and verify the graph state
        id: graph-state
        shell: bash
        run: |
          # The restored state is updated incrementally, then checked against a cold build.
          # Drift is a warning that rebuilds cold; it never fails the job.
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build | tee -a "$GITHUB_STEP_SUMMARY"
          if ! $GRAPH verify; then
            echo "::warning::the restored graph state differs from a cold build; rebuilding cold"
            $GRAPH build --force | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "digest=$($GRAPH status --json | jq -r '.digests["graph.json"]')" >> "$GITHUB_OUTPUT"

      - name: Calculate affected projects
        id: nx-affected
        uses: ./.github/actions/nx-affected
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD

  binary-budget:
    name: binary-budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # why: the approval label is read when the job runs, so re-running it after labelling the pull request sees the label
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: every commit the pull request adds is walked, not only its net diff

      - name: Read the approval label
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # why: reading the labels on their own line fails the step when gh fails, instead of silently treating the pull request as unapproved
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx 'binary-budget-approved' <<< "$labels"; then
            echo "flag=--allow-over-budget" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the binary budget
        env:
          BASE_REF: origin/${{ github.base_ref }}
          APPROVAL_FLAG: ${{ steps.approval.outputs.flag }}
        run: node tools/workspace/scripts/check-binary-budget.mjs --base "$BASE_REF" $APPROVAL_FLAG

  version-check:
    name: version-check
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.has-affected == 'true'
    permissions:
      contents: read # Read-only - no commits
      pull-requests: write # For failure comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Uses default GITHUB_TOKEN - no PAT needed for read-only validation

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Validate versions
        id: version-check
        uses: ./.github/actions/version-check
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          comment-on-success: 'false'

  format:
    name: format
    runs-on: ubuntu-latest
    needs: [setup, version-check]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run format check
        uses: ./.github/actions/run-checks
        with:
          check-type: format
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [setup, version-check]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run lint
        uses: ./.github/actions/run-checks
        with:
          check-type: lint
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [setup, version-check]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run typecheck
        uses: ./.github/actions/run-checks
        with:
          check-type: typecheck
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [setup, version-check, typecheck]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success' && needs.typecheck.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run build
        uses: ./.github/actions/run-checks
        with:
          check-type: build
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-pr
          path: dist/
          retention-days: 3
          if-no-files-found: warn

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [setup, version-check]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run tests
        uses: ./.github/actions/run-checks
        with:
          check-type: test
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-pr
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [setup, version-check, build]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success' && needs.build.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run E2E tests
        uses: ./.github/actions/run-checks
        with:
          check-type: e2e
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

  node-floor:
    name: node-floor
    runs-on: ubuntu-latest
    needs: [setup, version-check, build]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success' && needs.build.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build affected projects
        uses: ./.github/actions/run-checks
        with:
          check-type: build
          affected-only: 'true'
          affected-projects: ${{ needs.setup.outputs.affected-projects }}

      - name: Load every built package entry on each Node.js floor the packages declare
        # why: the packages declare different floors (most 18, the testing package 22.18, the linter 24), and the probe only covers a package on a release at or above its own floor, so it runs once per distinct floor on that exact release
        run: |
          for floor in $(node tools/workspace/scripts/probe-node-floor.mjs --list-floors); do
            echo "::group::Node.js $floor"
            npx -y -p "node@$floor" node tools/workspace/scripts/probe-node-floor.mjs
            echo "::endgroup::"
          done

  windows:
    name: windows
    runs-on: windows-latest
    needs: [setup, version-check]
    if: always() && needs.setup.outputs.has-affected == 'true' && needs.version-check.result == 'success'
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build the graph state and compare it with the Linux one
        run: |
          # The persisted graph is portable: the same commit yields byte-identical state on both legs.
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force
          DIGEST=$($GRAPH status --json | jq -r '.digests["graph.json"]')
          echo "windows graph.json digest $DIGEST, linux ${{ needs.setup.outputs.graph-digest }}"
          [ "$DIGEST" = "${{ needs.setup.outputs.graph-digest }}" ]

      - name: Typecheck the libraries and tools
        run: CI=1 npx nx run-many -t typecheck --projects="lib-*,tool-*" --parallel=1

      - name: Lint every project
        run: CI=1 npx nx lint:all

      - name: Test the libraries and tools
        run: CI=1 npx nx run-many -t test --projects="lib-*,tool-*" --parallel=1

  linter-support:
    name: linter-support (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: [setup, version-check]
    # why: the linter declares Node.js 24 on Linux and Windows, so its packed CLI and API are exercised on the floor release and the newest 24 on both, whenever the package is affected
    if: always() && needs.version-check.result == 'success' && contains(format(',{0},', needs.setup.outputs.affected-projects), ',lib-linter,')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.0.0', '24']
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build the linter
        run: CI=1 npx nx build lib-linter

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}

      - name: Lint, fix and test a rule in a consumer of the packed package
        run: node apps/package-e2e/linter/scripts/consumer-smoke.mjs

  ci-status:
    name: status
    runs-on: ubuntu-latest
    needs: [setup, binary-budget, version-check, format, lint, typecheck, build, test, e2e, node-floor, windows, linter-support]
    if: always()
    steps:
      - name: Check CI status
        run: |
          # why: the binary budget applies whether or not any project is affected, so it gates before that short-circuit
          if [ "${{ needs.binary-budget.result }}" != "success" ]; then
            echo "❌ The binary budget check did not pass"
            exit 1
          fi

          # If no affected projects, pass
          if [ "${{ needs.setup.outputs.has-affected }}" != "true" ]; then
            echo "✅ No affected projects - PR checks passed"
            exit 0
          fi

          # Check if any required job failed
          if [ "${{ needs.version-check.result }}" = "failure" ] || \
             [ "${{ needs.format.result }}" = "failure" ] || \
             [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.typecheck.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.e2e.result }}" = "failure" ] || \
             [ "${{ needs.node-floor.result }}" = "failure" ] || \
             [ "${{ needs.windows.result }}" = "failure" ] || \
             [ "${{ needs.linter-support.result }}" = "failure" ]; then
            echo "❌ One or more CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
