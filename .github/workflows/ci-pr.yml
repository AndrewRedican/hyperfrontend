name: pr

on:
  pull_request:
    branches: [main]

# Read-only permissions by default
permissions:
  contents: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      has-work: ${{ steps.plan.outputs.has-work }}
      graph-digest: ${{ steps.graph-state.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: the plan reads the merge base with the base branch

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          cache-scope: plan

      - name: Restore graph state
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .hf/graph
          key: ${{ runner.os }}-graph-state-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-graph-state-${{ hashFiles('**/package-lock.json') }}-

      - name: Build and verify the graph state
        id: graph-state
        shell: bash
        run: |
          # The restored state is updated incrementally, then checked against a cold build.
          # Drift is a warning that rebuilds cold; it never fails the job.
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build | tee -a "$GITHUB_STEP_SUMMARY"
          if ! $GRAPH verify; then
            echo "::warning::the restored graph state differs from a cold build; rebuilding cold"
            $GRAPH build --force | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "digest=$($GRAPH status --json | jq -r '.digests["graph.json"]')" >> "$GITHUB_OUTPUT"

      - name: Check the formatting of every file
        run: CI=1 npx nx format:check

      - name: Plan the pull request
        id: plan
        run: node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts plan --base "origin/${{ github.base_ref }}" --summary --github-output

      - name: Upload the plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-plan
          path: .hf/pipeline/plan.json
          retention-days: 7

  binary-budget:
    name: binary-budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # why: the approval label is read when the job runs, so re-running it after labelling the pull request sees the label
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: every commit the pull request adds is walked, not only its net diff

      - name: Read the approval label
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # why: reading the labels on their own line fails the step when gh fails, instead of silently treating the pull request as unapproved
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx 'binary-budget-approved' <<< "$labels"; then
            echo "flag=--allow-over-budget" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the binary budget
        env:
          BASE_REF: origin/${{ github.base_ref }}
          APPROVAL_FLAG: ${{ steps.approval.outputs.flag }}
        run: node tools/workspace/scripts/check-binary-budget.mjs --base "$BASE_REF" $APPROVAL_FLAG

  version-check:
    name: version-check
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.has-work == 'true'
    permissions:
      contents: read # Read-only - no commits
      pull-requests: write # For failure comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Uses default GITHUB_TOKEN - no PAT needed for read-only validation

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          cache-scope: plan

      - name: Restore graph state
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .hf/graph
          key: ${{ runner.os }}-graph-state-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-graph-state-${{ hashFiles('**/package-lock.json') }}-

      - name: Validate versions
        id: version-check
        uses: ./.github/actions/version-check
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          comment-on-success: 'false'

  environment:
    name: environment (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: [plan, version-check]
    if: always() && needs.plan.outputs.has-work == 'true' && needs.version-check.result == 'success'
    # why: the Windows environment runs typecheck, lint and test alone; the Linux one builds, so it gets the longer limit
    timeout-minutes: ${{ matrix.os == 'windows' && 90 || 120 }}
    permissions:
      contents: read
      checks: write # why: one check run per chain on the pull request, best-effort
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.environments) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: the versioning and e2e executors read history

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          cache-scope: environment

      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pipeline-plan
          path: .hf/pipeline

      - name: Build the graph state and compare it with the Linux one
        if: matrix.os == 'windows'
        run: |
          # The persisted graph is portable: the same commit yields byte-identical state on both legs.
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force
          DIGEST=$($GRAPH status --json | jq -r '.digests["graph.json"]')
          echo "windows graph.json digest $DIGEST, linux ${{ needs.plan.outputs.graph-digest }}"
          [ "$DIGEST" = "${{ needs.plan.outputs.graph-digest }}" ]

      - name: Run the plan
        run: node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts run --environment ${{ matrix.os }} --summary --checks --head-sha ${{ github.event.pull_request.head.sha }}

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-results-${{ matrix.os }}
          path: |
            .hf/pipeline/results-${{ matrix.os }}.json
            .hf/pipeline/logs
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always() && matrix.os == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-pr
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-pr
          path: dist/
          retention-days: 3
          if-no-files-found: warn

  ci-status:
    name: status
    runs-on: ubuntu-latest
    needs: [plan, binary-budget, version-check, environment]
    if: always()
    steps:
      - name: Check CI status
        run: |
          # why: the binary budget applies whether or not any project is affected, so it gates before that short-circuit
          if [ "${{ needs.binary-budget.result }}" != "success" ]; then
            echo "❌ The binary budget check did not pass"
            exit 1
          fi

          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "❌ The plan did not complete"
            exit 1
          fi

          # Nothing to run: the plan found no task the change reaches
          if [ "${{ needs.plan.outputs.has-work }}" != "true" ]; then
            echo "✅ No task is affected - PR checks passed"
            exit 0
          fi

          if [ "${{ needs.version-check.result }}" = "failure" ] || \
             [ "${{ needs.environment.result }}" != "success" ]; then
            echo "❌ One or more CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
