name: pr

on:
  pull_request:
    branches: [main]

# Read-only permissions by default
permissions:
  contents: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # why: the plan is published as the `pipeline plan` check run, which a page reads without a token
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      has-work: ${{ steps.plan.outputs.has-work }}
      graph-digest: ${{ steps.graph-state.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: the plan reads the merge base with the base branch

      - name: Setup
        uses: ./.github/actions/setup-monorepo

      - name: Graph state
        id: graph-state
        shell: bash
        # why: a cold build takes four seconds and nothing is restored, so the state is the commit's and nothing else's
        run: |
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$($GRAPH status --json | jq -r '.digests["graph.json"]')" >> "$GITHUB_OUTPUT"

      - name: Format
        run: npm run -s hf -- format --check --all

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts plan --base "origin/${{ github.base_ref }}" --summary --github-output --checks --head-sha ${{ github.event.pull_request.head.sha }}
          cp .hf/graph/graph.json .hf/pipeline/graph.json

      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-plan
          path: |
            .hf/pipeline/plan.json
            .hf/pipeline/graph.json
          retention-days: 7

  binary-budget:
    name: binary-budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # why: the approval label is read when the job runs, so re-running it after labelling the pull request sees the label
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: every commit the pull request adds is walked, not only its net diff

      - name: Approval label
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # why: reading the labels on their own line fails the step when gh fails, instead of silently treating the pull request as unapproved
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx 'binary-budget-approved' <<< "$labels"; then
            echo "flag=--allow-over-budget" >> "$GITHUB_OUTPUT"
          fi

      - name: Binary budget
        env:
          BASE_REF: origin/${{ github.base_ref }}
          APPROVAL_FLAG: ${{ steps.approval.outputs.flag }}
        run: node tools/workspace/scripts/check-binary-budget.mjs --base "$BASE_REF" $APPROVAL_FLAG

  version-check:
    name: version-check
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.has-work == 'true'
    permissions:
      contents: read # Read-only - no commits
      pull-requests: write # For failure comments
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Uses default GITHUB_TOKEN - no PAT needed for read-only validation

      - name: Setup
        uses: ./.github/actions/setup-monorepo

      - name: Validate versions
        id: version-check
        uses: ./.github/actions/version-check
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          comment-on-success: 'false'

  environment:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    needs: [plan, version-check]
    if: always() && needs.plan.outputs.has-work == 'true' && needs.version-check.result == 'success'
    # why: every environment builds and runs e2e, so they share one limit
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write # why: one check run per chain on the pull request, best-effort
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.environments) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: the versioning and e2e executors read history

      - name: Setup
        uses: ./.github/actions/setup-monorepo

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pipeline-plan
          path: .hf/pipeline

      - name: Compare graph state
        if: matrix.os != 'linux'
        run: |
          # The persisted graph is portable: the same commit yields byte-identical state on every leg.
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force
          DIGEST=$($GRAPH status --json | jq -r '.digests["graph.json"]')
          echo "${{ matrix.os }} graph.json digest $DIGEST, linux ${{ needs.plan.outputs.graph-digest }}"
          [ "$DIGEST" = "${{ needs.plan.outputs.graph-digest }}" ]

      - name: Run
        env:
          GITHUB_TOKEN: ${{ github.token }} # why: the chain check runs are created through the API; GitHub sets no token in the environment by itself
        # why: exec makes node the step's own process, so a cancel or the time limit signals the run itself, which stops its tasks and settles its check runs before the settle step reads them
        run: exec node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts run --environment ${{ matrix.os }} --summary --checks --head-sha ${{ github.event.pull_request.head.sha }}

      - name: Settle
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # why: a job killed by its time limit or a cancel writes no final results and leaves its check runs in progress; this completes them from the partial record
        run: node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts finalize --environment ${{ matrix.os }} --summary

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-results-${{ matrix.os }}
          path: |
            .hf/pipeline/results-${{ matrix.os }}.json
            .hf/pipeline/logs
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage
        if: always() && matrix.os == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-pr
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload dist
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-pr
          path: dist/
          retention-days: 3
          if-no-files-found: warn

  ci-status:
    name: status
    runs-on: ubuntu-latest
    needs: [plan, binary-budget, version-check, environment]
    if: always()
    steps:
      - name: Status
        run: |
          # why: the binary budget applies whether or not any project is affected, so it gates before that short-circuit
          if [ "${{ needs.binary-budget.result }}" != "success" ]; then
            echo "❌ The binary budget check did not pass"
            exit 1
          fi

          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "❌ The plan did not complete"
            exit 1
          fi

          # Nothing to run: the plan found no task the change reaches
          if [ "${{ needs.plan.outputs.has-work }}" != "true" ]; then
            echo "✅ No task is affected - PR checks passed"
            exit 0
          fi

          if [ "${{ needs.version-check.result }}" = "failure" ] || \
             [ "${{ needs.environment.result }}" != "success" ]; then
            echo "❌ One or more CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
