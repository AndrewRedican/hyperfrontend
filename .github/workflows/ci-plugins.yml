name: plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.github/workflows/ci-plugins.yml'
      - '.github/workflows/_lib-ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed plugins
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            # ============================================================
            # PLUGIN PATH FILTERS
            # Add new plugins here as they are created
            # Format: plugin-name: ['plugins/plugin-name/**']
            # ============================================================

            # EXCLUDED PLUGINS (not ready for CI):
            # - features: Excluded - experimental/unstable (v0.0.0)
            # - features-e2e: Excluded - e2e test project for features plugin

            # ACTIVE PLUGINS:
            # (Add new plugins below this line when ready for CI)
            # example-plugin:
            #   - 'plugins/example-plugin/**'

            workflow-changed:
              - '.github/workflows/ci-plugins.yml'
              - '.github/workflows/_lib-ci.yml'
              - '.github/actions/**'

      - name: Build matrix from filter outputs
        id: set-matrix
        shell: bash
        run: |
          # Build matrix based on paths-filter outputs
          MATRIX_ITEMS='[]'
          WORKFLOW_CHANGED="${{ steps.filter.outputs.workflow-changed }}"

          add_if_changed() {
            local changed="$1"
            local project="$2"
            local path="$3"
            local flag="$4"

            if [ "$WORKFLOW_CHANGED" = "true" ] || [ "$changed" = "true" ]; then
              MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq --arg p "$project" --arg c "./coverage/${path}/lcov.info" --arg f "$flag" '. + [{"project-name": $p, "coverage-path": $c, "coverage-flag": $f}]')
            fi
          }

          # ============================================================
          # PLUGIN MATRIX ENTRIES
          # Add new plugins here when ready for CI
          # Format: add_if_changed "${{ steps.filter.outputs.plugin-name }}" "plugin-name" "plugins/plugin-name" "plugin-name"
          # ============================================================

          # EXCLUDED PLUGINS (not ready for CI):
          # add_if_changed "${{ steps.filter.outputs.features }}" "plugin-features" "plugins/features" "features"
          # add_if_changed "${{ steps.filter.outputs.features-e2e }}" "plugin-features-e2e" "plugins/features-e2e" "features-e2e"

          # ACTIVE PLUGINS:
          # (Add new plugins below this line when ready for CI)
          # add_if_changed "${{ steps.filter.outputs.example-plugin }}" "plugin-example" "plugins/example" "example"

          # Check if matrix is empty
          COUNT=$(echo "$MATRIX_ITEMS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON=$(echo "$MATRIX_ITEMS" | jq -c '{include: .}')
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          fi

  ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/_lib-ci.yml
    with:
      project-name: ${{ matrix.project-name }}
      coverage-path: ${{ matrix.coverage-path }}
      coverage-flag: ${{ matrix.coverage-flag }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
