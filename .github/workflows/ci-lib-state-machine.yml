# Build status reporter for lib-state-machine
# This workflow does NOT build - it reports the outcome of the library's tasks in the ci workflow's results on main
name: lib-state-machine

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  status:
    uses: ./.github/workflows/_lib-status.yml
    with:
      project-name: lib-state-machine
      library-path: libs/state-machine
