name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every task of every project instead of what the push reaches'
        required: false
        type: boolean
        default: false

# Read-only permissions by default
permissions:
  contents: read

# Don't cancel in-progress runs on main
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      has-work: ${{ steps.plan.outputs.has-work }}
      graph-digest: ${{ steps.graph-state.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: the plan compares the push with the previous head of main

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build the graph state
        id: graph-state
        shell: bash
        # why: a cold build takes four seconds and nothing is restored, so the state is the commit's and nothing else's
        run: |
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$($GRAPH status --json | jq -r '.digests["graph.json"]')" >> "$GITHUB_OUTPUT"

      - name: Check the formatting of every file
        run: CI=1 npx nx format:check

      - name: Plan the push
        id: plan
        # why: the previous head of main is the base; a force-push, a first push or a dispatch without one plans everything, as does the full input
        run: |
          node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts plan --base "${{ github.event.before }}" --fallback-all --main --catch-up ${{ inputs.full == true && '--all' || '' }} --summary --github-output
          cp .hf/graph/graph.json .hf/pipeline/graph.json

      - name: Upload the plan and the graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-plan
          path: |
            .hf/pipeline/plan.json
            .hf/pipeline/graph.json
          retention-days: 30

  environment:
    name: environment (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: [plan]
    if: needs.plan.outputs.has-work == 'true'
    # why: the Windows environment runs typecheck, lint and test alone; the Linux one builds and publishes, so it gets the longer limit
    timeout-minutes: ${{ matrix.os == 'windows' && 90 || 120 }}
    permissions:
      contents: read
      checks: write # why: one check run per chain, best-effort
      actions: read # why: the Linux environment reads the Windows job's conclusion before it publishes
      id-token: write # why: npm provenance for the publishes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.environments) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # why: the versioning and e2e executors read history

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pipeline-plan
          path: .hf/pipeline

      - name: Build the graph state and compare it with the Linux one
        if: matrix.os == 'windows'
        run: |
          # The persisted graph is portable: the same commit yields byte-identical state on both legs.
          GRAPH="node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/graph.ts"
          $GRAPH build --force
          DIGEST=$($GRAPH status --json | jq -r '.digests["graph.json"]')
          echo "windows graph.json digest $DIGEST, linux ${{ needs.plan.outputs.graph-digest }}"
          [ "$DIGEST" = "${{ needs.plan.outputs.graph-digest }}" ]

      - name: Configure npm authentication
        if: matrix.os == 'linux'
        run: npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}" --location=user
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run the plan
        # why: the publishes inside the Linux run wait for the Windows environment to conclude; the publish executor still skips versions already on npm
        run: node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts run --environment ${{ matrix.os }} --summary --checks --wait-for "environment (windows)"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-results-${{ matrix.os }}
          path: |
            .hf/pipeline/results-${{ matrix.os }}.json
            .hf/pipeline/logs
          retention-days: 30
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always() && matrix.os == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-main
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload overall coverage to Codecov
        if: always() && matrix.os == 'linux'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

      - name: Upload library coverage to Codecov
        if: always() && matrix.os == 'linux'
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # Download official Codecov uploader
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Define library coverage mappings: flag:path
          LIBS=(
            "builder:libs/builder"
            "cryptography:libs/cryptography"
            "features:libs/features"
            "linter:libs/linter"
            "logging:libs/logging"
            "network-protocol:libs/network-protocol"
            "nexus:libs/nexus"
            "project-scope:libs/project-scope"
            "questions:libs/questions"
            "state-machine:libs/state-machine"
            "testing:libs/testing"
            "versioning:libs/versioning"
            "data-utils:libs/utils/data"
            "function-utils:libs/utils/function"
            "immutable-api-utils:libs/utils/immutable-api"
            "json-utils:libs/utils/json"
            "list-utils:libs/utils/list"
            "random-generator-utils:libs/utils/random-generator"
            "string-utils:libs/utils/string"
            "time-utils:libs/utils/time"
            "ui-utils:libs/utils/ui"
          )

          for entry in "${LIBS[@]}"; do
            flag="${entry%%:*}"
            path="${entry#*:}"
            lcov_file="./coverage/${path}/lcov.info"

            if [ -f "$lcov_file" ]; then
              echo "Uploading coverage for $flag..."
              ./codecov upload-process --token="$CODECOV_TOKEN" --file="$lcov_file" --flag="$flag" --disable-search || true
            else
              echo "No coverage file found for $flag at $lcov_file"
            fi
          done

      - name: Upload build artifacts
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  ci-status:
    name: status
    runs-on: ubuntu-latest
    needs: [plan, environment]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "❌ The plan did not complete on main branch"
            exit 1
          fi

          # Nothing to run: the push reaches no task and the registry lacks nothing
          if [ "${{ needs.plan.outputs.has-work }}" != "true" ]; then
            echo "✅ No task is affected on main branch"
            exit 0
          fi

          if [ "${{ needs.environment.result }}" != "success" ]; then
            echo "❌ One or more CI checks failed on main branch"
            exit 1
          fi

          echo "✅ All CI checks passed on main branch"

  push-tags:
    name: push-tags
    runs-on: ubuntu-latest
    needs: [environment]
    if: needs.environment.result == 'success'
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure version tags exist
        run: |
          # For each library with a publishable version, ensure tag points to HEAD
          for pkg in libs/*/package.json libs/*/*/package.json plugins/*/package.json; do
            [ -f "$pkg" ] || continue

            dir=$(dirname "$pkg")
            name=$(basename "$dir")
            parent=$(basename "$(dirname "$dir")")

            # Skip private packages (not intended for publishing)
            is_private=$(jq -r '.private // false' "$pkg" 2>/dev/null)
            if [ "$is_private" = "true" ]; then
              continue
            fi

            version=$(jq -r '.version // empty' "$pkg" 2>/dev/null)
            package_name=$(jq -r '.name // empty' "$pkg" 2>/dev/null)

            # Skip stub/unreleased packages (version 0.0.0)
            if [ -z "$version" ] || [ "$version" = "0.0.0" ]; then
              continue
            fi

            # Determine project name: libs/cryptography → lib-cryptography
            if [ "$parent" = "libs" ]; then
              project="lib-${name}"
            elif [ "$parent" = "plugins" ]; then
              project="plugin-${name}"
            else
              # Nested utils: libs/utils/data → lib-data-utils
              project="lib-${name}-utils"
            fi

            tag="${project}@${version}"

            # Check if tag exists and points to HEAD
            if git rev-parse "$tag" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-parse "$tag")
              HEAD_COMMIT=$(git rev-parse HEAD)

              if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
                echo "Tag $tag already points to HEAD"
                continue
              fi

              # Tag exists but points to old commit - check if published to npm.
              # A failed lookup is not a negative answer: only move the tag when the
              # registry positively reports the version as absent.
              if NPM_VERSION=$(npm view "${package_name}@${version}" version 2>/dev/null); then
                if [ "$NPM_VERSION" = "$version" ]; then
                  echo "Warning: $tag points to old commit but version is published to npm - preserving tag"
                  continue
                fi
              elif npm view "${package_name}" version >/dev/null 2>&1; then
                # The package resolves but this version does not, so it is genuinely unpublished.
                echo "$tag is not published - tag may be updated"
              else
                echo "Error: could not determine whether ${package_name}@${version} is published - preserving tag $tag"
                UNVERIFIED_TAGS="${UNVERIFIED_TAGS} ${tag}"
                continue
              fi

              # Not published, safe to update tag to point to HEAD
              git tag -f "$tag"
              echo "Updated tag $tag to point to HEAD (was $TAG_COMMIT)"
            else
              git tag "$tag"
              echo "Created tag: $tag"
            fi
          done

          if [ -n "${UNVERIFIED_TAGS}" ]; then
            echo "::error::Could not reach the registry to verify these tags, so they were left untouched:${UNVERIFIED_TAGS}"
            exit 1
          fi

      - name: Push version tags
        run: |
          # Force-push tags to ensure remote matches local. Only tags whose version the
          # registry positively reported as absent were moved in the previous step.
          git push origin --tags --force 2>/dev/null || echo "No tags to push"

  create-github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs: [environment, push-tags]
    if: always() && needs.environment.result == 'success'
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get version tags needing releases
        id: tags
        run: |
          # Get all version tags (format: project@version)
          ALL_TAGS=$(git tag | grep -E '^(lib-|plugin-).+@[0-9]+\.[0-9]+\.[0-9]+' || echo "")

          if [ -z "$ALL_TAGS" ]; then
            echo "No version tags found"
            echo "has_tags=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found version tags:"
          echo "$ALL_TAGS"
          echo "has_tags=true" >> $GITHUB_OUTPUT
          # Convert newlines to comma-separated list
          echo "tags=$(echo "$ALL_TAGS" | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Create GitHub Releases
        if: steps.tags.outputs.has_tags == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const tags = '${{ steps.tags.outputs.tags }}'.split(',').filter(Boolean)

            /**
             * Extracts changelog entry for a specific version.
             * Looks for "## X.Y.Z" or "## [X.Y.Z]" header and captures until next version header.
             */
            function extractChangelogEntry(changelogPath, version) {
              if (!fs.existsSync(changelogPath)) {
                return null
              }

              const content = fs.readFileSync(changelogPath, 'utf-8')
              const lines = content.split('\n')

              let capturing = false
              let entry = []

              for (const line of lines) {
                // Check for version header: "## 1.0.0" or "## [1.0.0]" or "## 1.0.0 (date)"
                if (line.startsWith('## ')) {
                  if (capturing) {
                    // Hit next version, stop capturing
                    break
                  }
                  // Check if this is our version
                  const headerVersion = line.slice(3).trim()
                    .replace(/^\[/, '').replace(/\].*$/, '')  // Remove brackets
                    .split(/[\s(]/)[0]  // Take version before space or paren

                  if (headerVersion === version) {
                    capturing = true
                    entry.push(line)  // Include the header
                  }
                } else if (capturing) {
                  entry.push(line)
                }
              }

              // Trim trailing empty lines
              while (entry.length > 0 && entry[entry.length - 1].trim() === '') {
                entry.pop()
              }

              return entry.length > 0 ? entry.join('\n') : null
            }

            /**
             * Resolves project name to changelog path.
             * lib-cryptography -> libs/cryptography/CHANGELOG.md
             * lib-data-utils -> libs/utils/data/CHANGELOG.md
             */
            function getChangelogPath(projectName) {
              if (projectName.endsWith('-utils')) {
                // Nested utils: lib-data-utils -> libs/utils/data
                const utilName = projectName.replace('lib-', '').replace('-utils', '')
                return `libs/utils/${utilName}/CHANGELOG.md`
              } else if (projectName.startsWith('lib-')) {
                return `libs/${projectName.replace('lib-', '')}/CHANGELOG.md`
              } else if (projectName.startsWith('plugin-')) {
                return `plugins/${projectName.replace('plugin-', '')}/CHANGELOG.md`
              }
              return null
            }

            for (const tag of tags) {
              console.log(`Creating release for ${tag}`)

              try {
                // Parse project name and version from tag
                const match = tag.match(/^(.+)@(\d+\.\d+\.\d+.*)$/)
                if (!match) {
                  console.log(`Skipping invalid tag format: ${tag}`)
                  continue
                }

                const [, projectName, version] = match

                // Extract changelog entry
                const changelogPath = getChangelogPath(projectName)
                let releaseBody = ''

                if (changelogPath) {
                  const changelogEntry = extractChangelogEntry(changelogPath, version)
                  if (changelogEntry) {
                    releaseBody = changelogEntry
                  } else {
                    releaseBody = `Release of ${projectName} version ${version}`
                  }
                  releaseBody += `\n\n---\n📦 [View on npm](https://www.npmjs.com/package/@hyperfrontend/${projectName.replace('lib-', '').replace('plugin-', '')})`
                  releaseBody += `\n📄 [Full Changelog](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/${changelogPath})`
                } else {
                  releaseBody = `Release of ${projectName} version ${version}`
                }

                // Check if release already exists
                try {
                  await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag: tag,
                  })
                  console.log(`Release for ${tag} already exists, skipping`)
                  continue
                } catch (e) {
                  // Release doesn't exist, create it
                }

                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `${projectName} v${version}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: version.includes('-'),
                })

                console.log(`✓ Created release for ${tag}`)
              } catch (error) {
                console.log(`⚠ Failed to create release for ${tag}: ${error.message}`)
              }
            }

  dispatch-native-builds:
    name: dispatch-native-builds
    runs-on: ubuntu-latest
    needs: [environment, push-tags, create-github-release]
    if: always() && needs.environment.result == 'success'
    permissions:
      contents: read
      actions: write # required to dispatch the per-lib native workflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Each entry: "<lib-tag-prefix>:<workflow-file>"
      # When a tag matching the prefix points at HEAD, dispatch the matching
      # workflow with the tag as `release-tag` so it builds per-platform native
      # binaries and attaches them to the GitHub Release. Per Decision #60 the
      # binaries are also published as per-platform npm sub-packages (Phase 16);
      # the release attach is the audit-trail redundancy path.
      - name: Dispatch per-lib native workflows for new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NATIVE_LIBS=(
            "lib-builder:ci-lib-builder-native.yml"
          )

          HEAD_SHA=$(git rev-parse HEAD)

          for entry in "${NATIVE_LIBS[@]}"; do
            prefix="${entry%%:*}"
            workflow="${entry#*:}"

            # All tags pointing at HEAD that match this lib's prefix.
            mapfile -t TAGS < <(git tag --points-at "$HEAD_SHA" | grep -E "^${prefix}@" || true)

            if [ ${#TAGS[@]} -eq 0 ]; then
              echo "No fresh ${prefix}@* tags at HEAD — skipping native dispatch."
              continue
            fi

            for tag in "${TAGS[@]}"; do
              echo "Dispatching ${workflow} for tag ${tag}"
              gh workflow run "${workflow}" \
                --ref main \
                -f release-tag="${tag}"
            done
          done
