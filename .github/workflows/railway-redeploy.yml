name: railway-redeploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'The Railway services to redeploy, separated by commas or spaces, or all: clock heartbeat koi-pond koi-angular koi-lit koi-preact koi-react koi-solid koi-svelte koi-vanilla koi-vue'
        required: true
        type: string
        default: all
      commit:
        description: 'The commit to build; the head of the chosen branch when empty'
        required: false
        type: string
        default: ''

# Nothing is written to the repository; the deploy goes to Railway with the project token.
permissions:
  contents: read

concurrency:
  group: railway-redeploy
  cancel-in-progress: false

jobs:
  services:
    name: services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Choose the services
        id: matrix
        env:
          SERVICES: ${{ inputs.services }}
        run: |
          # why: a choice input picks one option, so the set is typed; every name is checked against the services .railway/railway.ts declares before anything deploys
          DECLARED="clock heartbeat koi-pond koi-angular koi-lit koi-preact koi-react koi-solid koi-svelte koi-vanilla koi-vue"
          CHOSEN=$(echo "$SERVICES" | tr ',' ' ')
          if [ "$CHOSEN" = "all" ]; then CHOSEN="$DECLARED"; fi
          MATRIX=""
          for service in $CHOSEN; do
            case " $DECLARED " in
              *" $service "*) ;;
              *) echo "::error::'$service' is not a service .railway/railway.ts declares: $DECLARED"; exit 1 ;;
            esac
            case ",$MATRIX," in
              *",\"$service\","*) ;;
              *) MATRIX="${MATRIX:+$MATRIX,}\"$service\"" ;;
            esac
          done
          if [ -z "$MATRIX" ]; then echo "::error::no service was chosen"; exit 1; fi
          # why: one job per service, so each deployment has its own log and its own outcome, as the deploy tasks of a main run do
          echo "matrix=[$MATRIX]" >> "$GITHUB_OUTPUT"

  redeploy:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [services]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'

      # why: the deploy script has no dependencies and fetches the Railway CLI itself, so the monorepo is not installed
      - name: Redeploy
        env:
          HF_DEPLOY_SERVICE: ${{ matrix.service }}
          HF_DEPLOY_COMMIT: ${{ inputs.commit }} # why: empty falls through to GITHUB_SHA, the head of the branch the run was dispatched on
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node tools/pipeline/scripts/railway-deploy.mjs
