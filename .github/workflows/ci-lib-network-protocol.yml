# Build status reporter for lib-network-protocol
# This workflow does NOT build - it reports status from ci-libraries.yml matrix build
name: lib-network-protocol

on:
  workflow_run:
    workflows: [libraries]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  status:
    uses: ./.github/workflows/_lib-status.yml
    with:
      project-name: lib-network-protocol
      library-path: libs/network-protocol
