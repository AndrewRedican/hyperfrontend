name: 'CLA Assistant'

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: '.github/signatures/cla.json'
          path-to-document: 'https://github.com/AndrewRedican/hyperfrontend/blob/main/CLA.md'
          branch: 'main'
          allowlist: bot*,dependabot*
          remote-organization-name: 'AndrewRedican'
          remote-repository-name: 'hyperfrontend'
          create-file-commit-message: 'chore: create CLA signature file'
          signed-commit-message: 'chore: sign CLA for $contributorName'
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge this pull request, we need you to sign our Contributor License Agreement (CLA).<br><br>**📝 To sign the CLA:**<br>Please read our [CLA document](https://github.com/AndrewRedican/hyperfrontend/blob/main/CLA.md) and comment on this PR with:<br><br>`I have read the CLA Document and I hereby sign the CLA`<br><br>**Important**: By signing, you agree to grant the project maintainer exclusive rights to your contributions as detailed in the CLA.<br><br>If you have already signed the CLA and are seeing this message, please comment:<br><br>`recheck`'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: false
