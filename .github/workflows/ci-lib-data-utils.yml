# Build status reporter for lib-data-utils
# This workflow does NOT build - it reports status from ci-libraries.yml matrix build
name: lib-data-utils

on:
  workflow_run:
    workflows: [libraries]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  status:
    uses: ./.github/workflows/_lib-status.yml
    with:
      project-name: lib-data-utils
      library-path: libs/utils/data
