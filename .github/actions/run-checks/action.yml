name: 'Run Checks'
description: 'Runs specific checks (format, lint, typecheck, test, build, e2e) for all or affected projects'
inputs:
  check-type:
    description: 'Type of check to run: format, lint, typecheck, test, build, or e2e'
    required: true
  affected-only:
    description: 'Whether to run checks only on affected projects'
    required: false
    default: 'false'
  affected-projects:
    description: 'Comma-separated list of affected project names (required if affected-only is true)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Run ${{ inputs.check-type }} check
      shell: bash
      run: |
        CHECK_TYPE="${{ inputs.check-type }}"
        AFFECTED_ONLY="${{ inputs.affected-only }}"
        AFFECTED_PROJECTS="${{ inputs.affected-projects }}"

        # Formatting is a top-level Nx command over the whole tree rather than a project
        # target, so it never takes the run-many path below. Checking every file costs
        # about a second and keeps the gate independent of the affected calculation.
        if [ "$CHECK_TYPE" = "format" ]; then
          echo "Running format:check on all files"
          CI=1 npx nx format:check
          exit $?
        fi

        # Determine the Nx target based on check type
        case "$CHECK_TYPE" in
          lint)
            TARGET="lint"
            ;;
          typecheck)
            TARGET="typecheck"
            ;;
          test)
            TARGET="test"
            ;;
          build)
            TARGET="build"
            ;;
          e2e)
            TARGET="e2e"
            ;;
          *)
            echo "Error: Unknown check type '$CHECK_TYPE'"
            exit 1
            ;;
        esac

        # Build the command
        # CI=1 ensures deterministic behavior, --parallel=1 prevents resource exhaustion
        if [ "$AFFECTED_ONLY" = "true" ] && [ -n "$AFFECTED_PROJECTS" ]; then
          # Run only on affected projects
          echo "Running $TARGET on affected projects: $AFFECTED_PROJECTS"
          CI=1 npx nx run-many -t=$TARGET --projects=$AFFECTED_PROJECTS --parallel=1
        elif [ "$AFFECTED_ONLY" = "true" ] && [ -z "$AFFECTED_PROJECTS" ]; then
          # No affected projects, skip
          echo "No affected projects, skipping $TARGET check"
          exit 0
        else
          # Run on all projects
          echo "Running $TARGET on all projects"
          CI=1 npx nx run-many -t=$TARGET --all --parallel=1
        fi
