name: 'Setup Monorepo'
description: 'Sets up Node.js, caches the npm download directory and installs the packages of the monorepo'
outputs:
  cache-hit:
    description: 'Whether npm cache was hit'
    value: ${{ steps.cache-npm.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    - name: Keep Nx off its cloud
      shell: bash
      # why: nx.json sets neverConnectToCloud; the variable makes every nx invocation of the job honour it
      run: |
        [[ $(jq -r '.neverConnectToCloud // false' nx.json) == "true" ]] && echo "NX_NO_CLOUD=true" >> $GITHUB_ENV || true

    - name: Setup Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version-file: '.nvmrc'

    - name: Cache npm dependencies
      id: cache-npm
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      shell: bash
      run: npm ci
