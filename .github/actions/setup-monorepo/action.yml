name: 'Setup Monorepo'
description: 'Sets up Node.js environment, caches dependencies, and installs packages for the monorepo'
inputs:
  install-hugo:
    description: 'Whether to install Hugo (required for documentation builds)'
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: 'Whether npm cache was hit'
    value: ${{ steps.cache-npm.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: '24.13.0'

    - name: Cache npm dependencies
      id: cache-npm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Hugo
      if: inputs.install-hugo == 'true'
      shell: bash
      run: |
        HUGO_VERSION="0.121.1"
        wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz
        tar -xzf hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz
        sudo mv hugo /usr/local/bin/
        hugo version
