<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      .sheet { fill: #EFF6FF; }
      .fold { fill: #E2E8F0; }
      .plan-block { fill: #A855F7; }
      .plan-node { fill: #3B82F6; }
      .stroke-main { stroke: #0F172A; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
      .stroke-plan { stroke: #0F172A; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- Blueprint Sheet with Folded Corner -->
  <path d="M 64 44 L 156 44 L 192 80 L 192 212 L 64 212 Z" class="sheet" />
  <path d="M 156 44 L 156 80 L 192 80 Z" class="fold" />
  <path d="M 64 44 L 156 44 L 192 80 L 192 212 L 64 212 Z" class="stroke-main" />
  <path d="M 156 44 L 156 80 L 192 80" class="stroke-main" />

  <!-- Schematic Plan: Two Blocks Joined by a Routed Connector -->
  <rect x="84" y="104" width="38" height="30" class="plan-block" />
  <rect x="84" y="104" width="38" height="30" class="stroke-plan" />
  <rect x="134" y="156" width="38" height="30" class="plan-node" />
  <rect x="134" y="156" width="38" height="30" class="stroke-plan" />
  <path d="M 122 119 L 153 119 L 153 156" class="stroke-plan" />

  <!-- Dashed Measurement Guide -->
  <path d="M 84 196 L 122 196" class="stroke-plan" stroke-dasharray="1 8" opacity="0.5" />
</svg>
