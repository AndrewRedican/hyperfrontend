# Lefthook Configuration
# See: https://github.com/evilmartians/lefthook

# Show output in real-time instead of buffering until completion
output:
  - meta # Show command names
  - summary # Show summary at end
  - success # Show successful commands
  - failure # Show failed commands
  - execution # Show command execution output in real-time
  - execution_info # Show execution details

pre-commit:
  parallel: false
  commands:
    binary-budget:
      run: node tools/workspace/scripts/check-binary-budget.mjs --staged --allow-over-budget
      fail_text: 'A staged file is over the 2,000,000-byte limit. Unstage it and keep it out of Git, or shrink it.'
    format:
      run: npm run -s hf -- format --write
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx cl {1}
      fail_text: 'Your commit message does not follow the standard conventional commit format. See https://www.conventionalcommits.org/en/v1.0.0/'

pre-push:
  piped: true # Run sequentially AND stop on first failure
  commands:
    audit:
      priority: 1
      run: npm run -s hf -- run-many -t audit --all
      fail_text: 'Security audit failed. Run "npm audit" in the reported project directory to see vulnerabilities and "npm audit fix" to resolve them.'
    binary-budget:
      priority: 2
      run: node tools/workspace/scripts/check-binary-budget.mjs --allow-over-budget
      fail_text: 'A commit on this branch adds a file over the 2,000,000-byte limit, which CI rejects. Drop it from the branch history before pushing.'
    pipeline:
      priority: 3
      # why: the same plan and prerequisite rules as CI, one task at a time; dependents of a failure are skipped and everything independent still runs
      run: CI=1 NODE_OPTIONS="--expose-gc --max-old-space-size=4096" node --import ./tools/lint/src/runtime/aliases.ts tools/workspace/bin/pipeline.ts run --local
      fail_text: 'The pipeline failed. Read the summary above; each task wrote its log under .hf/pipeline/logs.'
    version:
      priority: 4
      run: npm run -s hf -- run @hyperfrontend/workspace:version:all --verbose
      fail_text: |
        ❌ Version batch processing failed.

        Please check the output above for details.
        If you need to skip versioning temporarily, use: git push --no-verify
        Note: CI will fail if versions are not properly applied.
