# Lefthook Configuration
# See: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    format:
      run: npx nx format:write
      stage_fixed: true
    docs:
      run: cd docs && node scripts/extract-readme.js && cd .. && git add docs/content/
      glob: '{README.md,docs/**/*}'

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit $1
      fail_text: 'Your commit message does not follow the standard conventional commit format. See https://www.conventionalcommits.org/en/v1.0.0/'

pre-push:
  parallel: false
  commands:
    version:
      run: |
        # Skip versioning when pushing to main - CI handles main branch
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ]; then
          echo "⏭️ Skipping versioning on main branch (CI will handle)"
          exit 0
        fi

        # Get affected library projects
        AFFECTED=$(npx nx show projects --affected --base=origin/main --head=HEAD --type=lib 2>/dev/null | tr '\n' ' ')

        if [ -z "$AFFECTED" ]; then
          echo "✅ No affected libraries to version"
          exit 0
        fi

        echo "📦 Versioning affected libraries: $AFFECTED"

        # Run versioning for each library without commit/tag
        # --skipCommit: We make one combined commit below
        # --skipTag: Tags are created by main CI after merge
        for lib in $AFFECTED; do
          echo "  → Checking $lib..."
          RESULT=$(npx nx version "$lib" --skipCommit --skipTag 2>&1 || true)
          if echo "$RESULT" | grep -q "version updated"; then
            echo "    ✓ version updated"
          elif echo "$RESULT" | grep -q "already exists (skipping)"; then
            echo "    ○ already versioned"
          elif echo "$RESULT" | grep -q "Skipping"; then
            echo "    ○ skipped (version commit or git state)"
          else
            echo "    ○ no version change needed"
          fi
        done

        # Stage version-related changes
        git add libs/*/package.json libs/*/CHANGELOG.md plugins/*/package.json plugins/*/CHANGELOG.md 2>/dev/null || true

        # Commit if there are staged changes
        if ! git diff --staged --quiet; then
          # Commit message matches recursion prevention pattern: /^chore: update versions for/
          git commit -m "chore(@hyperfrontend/workspace): update versions for affected libs" --no-verify
          echo "✅ Version updates committed"
        else
          echo "✅ No version changes needed"
        fi
      fail_text: 'Version check failed. You may need to resolve conflicts or run versioning manually.'
